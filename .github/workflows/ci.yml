name: StudentFlow checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: student_site/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        working-directory: student_site
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        working-directory: student_site
        run: python -m playwright install --with-deps chromium
      - name: Run server tests
        working-directory: student_site
        run: python -m pytest -q
      - name: Run real-browser end-to-end smoke test
        working-directory: student_site
        run: python tests/e2e_studentflow.py
      - name: Check Python style
        working-directory: student_site
        run: python -m ruff check app.py migrations.py backup_db.py tests
      - name: Check browser-module logic
        working-directory: student_site
        run: node tests/check_lab10_logic.cjs
